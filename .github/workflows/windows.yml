# Monta o NaView para Windows (versão Qt, ver docs/sdd/specs/06-windows.md).
#
# Numa máquina Windows do GitHub: empacota app_qt.py com o PyInstaller, confere que o .exe abre
# (inclusive o jogo, que usa o navegador embutido do Qt) e monta o instalador com o Inno Setup.
# O instalador passa de 100 MB (limite de arquivo do GitHub), então não fica no repositório como o
# piloto: vai por SSH para uma pasta da VPS que o site serve em /download/windows/, junto com
# windows.json (versão, tamanho, SHA-256), que a página lê. Sem os segredos VPS_* cadastrados no
# GitHub, o envio é pulado e o instalador fica só como "artifact" da execução (aba Actions).
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "janelas/**"
      - "jogo/**"
      - "web/**"
      - "arte/**"
      - "sons/**"
      - "fonts/**"
      - "icones/**"
      - VERSAO
      - ferramentas/instalador.iss
      - .github/workflows/windows.yml

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  montar:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6 completo: o jogo precisa do QtWebEngine, que não vem no PySide6-Essentials.
      - name: Instalar dependências
        run: python -m pip install "PySide6~=6.8.0" "pyinstaller~=6.11"

      - name: Empacotar
        run: >
          pyinstaller --noconfirm --windowed --name NaView
          --icon ferramentas/icone.ico
          --add-data "arte;arte" --add-data "sons;sons" --add-data "fonts;fonts"
          --add-data "icones;icones" --add-data "web;web" --add-data "icone.svg;."
          --exclude-module tkinter --exclude-module gi
          app_qt.py

      # Tira o que o NaView não usa, para o instalador caber no limite de 100 MB do GitHub: idiomas
      # do navegador embutido (fica português e inglês), traduções do Qt, ferramentas de
      # desenvolvedor do navegador e módulos do Qt que vêm junto por dependência.
      - name: Enxugar
        shell: pwsh
        run: |
          $pyside = "dist/NaView/_internal/PySide6"
          $antes = (Get-ChildItem dist/NaView -Recurse -File | Measure-Object Length -Sum).Sum
          Get-ChildItem "$pyside/translations/qtwebengine_locales" -File |
            Where-Object { $_.Name -notin @("pt-BR.pak", "en-US.pak") } | Remove-Item
          Get-ChildItem "$pyside/translations" -File | Where-Object { $_.Name -notlike "*pt_BR*" } | Remove-Item
          Remove-Item -ErrorAction SilentlyContinue "$pyside/resources/qtwebengine_devtools_resources*.pak"
          foreach ($nome in @("Qt6Pdf*.dll", "Qt6Quick3D*.dll", "Qt6VirtualKeyboard*.dll", "Qt6Charts*.dll",
                              "Qt6DataVisualization*.dll", "Qt63D*.dll", "Qt6Designer*.dll")) {
            Remove-Item -ErrorAction SilentlyContinue "$pyside/$nome"
          }
          $depois = (Get-ChildItem dist/NaView -Recurse -File | Measure-Object Length -Sum).Sum
          "Pasta do app: {0:N0} MB -> {1:N0} MB" -f ($antes / 1MB), ($depois / 1MB)
          Get-ChildItem dist/NaView -Recurse -File | Sort-Object Length -Descending | Select-Object -First 40 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path dist/NaView).Path.Length) }
          Get-ChildItem dist/NaView/_internal -Directory | ForEach-Object {
            "{0,8:N1} MB  pasta {1}" -f ((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), $_.Name }

      - name: Conferir se abre
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath dist/NaView/NaView.exe -ArgumentList '--verificar' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "O .exe saiu com código $($p.ExitCode)"; exit 1 }

      - name: Montar o instalador
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $versao = (Get-Content VERSAO -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersao=$versao" ferramentas/instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Instalador: {0:N1} MB" -f ((Get-Item saida/NaView-instalador.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: NaView-instalador
          path: saida/NaView-instalador.exe
          retention-days: 30

      # Segredos: VPS_HOST, VPS_USUARIO, VPS_PASTA, VPS_CHAVE (chave SSH privada só deste envio) e
      # VPS_HOST_KEY (linha do known_hosts da VPS, para não aceitar um servidor falso).
      - name: Enviar para a VPS
        if: env.VPS_HOST != ''
        shell: bash
        env:
          VPS_USUARIO: ${{ secrets.VPS_USUARIO }}
          VPS_PASTA: ${{ secrets.VPS_PASTA }}
          VPS_CHAVE: ${{ secrets.VPS_CHAVE }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_CHAVE" > ~/.ssh/naview && chmod 600 ~/.ssh/naview
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts_naview
          arquivo=saida/NaView-instalador.exe
          versao=$(tr -d '\r\n' < VERSAO)
          bytes=$(stat -c %s "$arquivo")
          tamanho=$(python -c "print(f'{$bytes / 1048576:.1f} MB'.replace('.', ','))")
          sha=$(sha256sum "$arquivo" | cut -d' ' -f1)
          printf '{"versao": "%s", "arquivo": "NaView-instalador.exe", "tamanho": "%s", "sha256": "%s"}\n' \
            "$versao" "$tamanho" "$sha" > saida/windows.json
          opcoes=(-i ~/.ssh/naview -o UserKnownHostsFile=~/.ssh/known_hosts_naview -o StrictHostKeyChecking=yes)
          destino="$VPS_USUARIO@$VPS_HOST"
          # Envia com nome provisório e só depois troca: quem baixar no meio do envio não pega meio arquivo.
          scp "${opcoes[@]}" "$arquivo" "$destino:$VPS_PASTA/NaView-instalador.exe.novo"
          scp "${opcoes[@]}" saida/windows.json "$destino:$VPS_PASTA/windows.json.novo"
          ssh "${opcoes[@]}" "$destino" "cd '$VPS_PASTA' && mv -f NaView-instalador.exe.novo NaView-instalador.exe && mv -f windows.json.novo windows.json"
