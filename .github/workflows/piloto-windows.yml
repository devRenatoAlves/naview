# Monta o piloto Windows do NaView (teste de viabilidade, ver docs/sdd/specs/06-windows.md).
#
# Numa máquina Windows do GitHub: empacota ferramentas/teste_windows.py num .exe (PyInstaller),
# confere que ele abre e guarda o .zip em site/piloto-windows/. O site (Coolify) publica esse
# arquivo na página /piloto/ no próximo deploy.
name: Piloto Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ferramentas/teste_windows.py
      - ferramentas/icone.ico
      - .github/workflows/piloto-windows.yml

permissions:
  contents: write

concurrency:
  group: piloto-windows
  cancel-in-progress: true

jobs:
  montar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6-Essentials: só os módulos básicos do Qt (sem o navegador embutido), bem menor.
      - name: Instalar dependências
        run: python -m pip install "PySide6-Essentials~=6.8.0" "pyinstaller~=6.11"

      - name: Empacotar
        run: >
          pyinstaller --noconfirm --windowed --name NaView-piloto
          --icon ferramentas/icone.ico --add-data "ferramentas/icone.ico;."
          --exclude-module tkinter
          ferramentas/teste_windows.py

      - name: Conferir se abre
        shell: pwsh
        timeout-minutes: 2
        run: |
          $p = Start-Process -FilePath dist/NaView-piloto/NaView-piloto.exe -ArgumentList '--verificar' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "O .exe saiu com código $($p.ExitCode)"; exit 1 }

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist/NaView-piloto -DestinationPath naview-piloto-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: naview-piloto-windows
          path: naview-piloto-windows.zip

      - name: Guardar no repositório
        shell: bash
        run: |
          mkdir -p site/piloto-windows
          cp naview-piloto-windows.zip site/piloto-windows/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/piloto-windows/naview-piloto-windows.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(piloto): pacote Windows do teste de viabilidade"
          git pull --rebase origin main
          git push origin HEAD:main
