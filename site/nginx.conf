server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml font/ttf;

    # A página sempre confere se há versão nova (o CSS e o JS levam ?v= com o código do conteúdo).
    # add_header dentro de location anula os de fora, por isso eles se repetem aqui.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Dados do instalador do Windows (enviado pelo GitHub Actions para a VPS): sempre o mais novo.
    location = /download/windows/windows.json {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }

    # Manifesto que o app consulta para saber se há versão nova (ferramentas/gerar_site.py).
    location = /download/versao.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }

    # Pacotes do app: sempre como download.
    location /download/ {
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(svg|ttf|js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
